<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BahasaBudi AI — Pembantu Pembelajaran Bahasa Melayu</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f0f2f5;
      --chat-bg:   #ffffff;
      --header-bg: #1a6b3c;
      --header-fg: #ffffff;
      --bot-bubble: #e8f5e9;
      --bot-border: #a5d6a7;
      --user-bubble: #1a6b3c;
      --user-fg:   #ffffff;
      --input-bg:  #ffffff;
      --border:    #e0e0e0;
      --text:      #212121;
      --muted:     #757575;
      --accent:    #1a6b3c;
      --link:      #1565c0;
      --radius:    14px;
    }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    /* ── Shell ── */
    .chat-shell {
      width: 100%;
      max-width: 680px;
      height: 92vh;
      max-height: 820px;
      background: var(--chat-bg);
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.13);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .chat-header {
      background: var(--header-bg);
      color: var(--header-fg);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .chat-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #ffffff33;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .chat-header-info h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .chat-header-info p {
      font-size: 12px;
      opacity: 0.82;
      margin-top: 2px;
    }
    .chat-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      opacity: 0.85;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #69f0ae;
    }

    /* ── Message area ── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .chat-messages::-webkit-scrollbar { width: 5px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: #bbb; border-radius: 4px; }

    /* ── Bubbles ── */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .msg-row.bot { align-self: flex-start; max-width: 88%; }
    .msg-row.user { align-self: flex-end; max-width: 82%; flex-direction: row-reverse; }

    .msg-icon {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--header-bg);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .bubble {
      padding: 11px 15px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
      word-break: break-word;
    }
    .bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--bot-border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }
    .user .bubble {
      background: var(--user-bubble);
      color: var(--user-fg);
      border-bottom-right-radius: 4px;
    }

    /* markdown-lite rendering */
    .bubble h2 { font-size: 14px; font-weight: 700; margin: 8px 0 4px; color: var(--accent); }
    .bubble h3 { font-size: 13px; font-weight: 600; margin: 6px 0 3px; }
    .bubble strong { font-weight: 700; }
    .bubble em { font-style: italic; }
    .bubble ul { padding-left: 18px; margin: 4px 0; }
    .bubble li { margin: 2px 0; }
    .bubble a { color: var(--link); }
    .bubble hr { border: none; border-top: 1px solid var(--bot-border); margin: 8px 0; }
    .bubble table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 6px 0; }
    .bubble th { background: #c8e6c9; padding: 5px 8px; text-align: left; font-weight: 600; }
    .bubble td { padding: 4px 8px; border-bottom: 1px solid #ddd; }
    .bubble tr:last-child td { border-bottom: none; }
    .bubble tr:nth-child(even) td { background: #f1f8e9; }
    .bubble code { background: #e8f5e9; border-radius: 4px; padding: 1px 5px; font-family: monospace; font-size: 12px; }
    .bubble blockquote { border-left: 3px solid var(--accent); margin: 6px 0; padding: 4px 10px; background: #f9fbe7; border-radius: 0 6px 6px 0; font-style: italic; color: #555; }

    .msg-time {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      text-align: right;
    }
    .bot .msg-time { text-align: left; }

    /* ── Typing indicator ── */
    .typing-row { display: flex; align-items: center; gap: 8px; align-self: flex-start; }
    .typing-bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--bot-border);
      padding: 10px 14px;
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      display: flex; gap: 5px; align-items: center;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #888; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

    /* ── Quick-reply chips ── */
    .chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 0;
      align-self: flex-start;
      max-width: 100%;
    }
    .chip {
      background: #ffffff;
      border: 1.5px solid var(--accent);
      color: var(--accent);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12.5px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .chip:hover { background: var(--accent); color: #fff; }

    /* ── Input bar ── */
    .chat-input-area {
      border-top: 1px solid var(--border);
      padding: 12px 14px;
      background: var(--input-bg);
      flex-shrink: 0;
    }
    .chat-input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: #f5f5f5;
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 8px 8px 8px 16px;
      transition: border-color 0.15s;
    }
    .chat-input-row:focus-within { border-color: var(--accent); }
    #userInput {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      outline: none;
      max-height: 120px;
      min-height: 22px;
      font-family: inherit;
      color: var(--text);
    }
    #userInput::placeholder { color: #aaa; }
    #sendBtn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    #sendBtn:hover { background: #145c32; }
    #sendBtn:active { transform: scale(0.93); }
    #sendBtn svg { width: 18px; height: 18px; fill: #fff; }

    .input-hint {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-top: 6px;
    }

    /* ── Scrollbar auto-scroll ── */
    @media (max-width: 480px) {
      .chat-shell { height: 100vh; max-height: 100vh; border-radius: 0; }
      body { padding: 0; }
    }
  </style>
</head>
<body>

<div class="chat-shell">

  <!-- Header -->
  <div class="chat-header">
    <div class="chat-avatar">📚</div>
    <div class="chat-header-info">
      <h1>BahasaBudi AI</h1>
      <p>Pembantu Pembelajaran Bahasa Melayu</p>
    </div>
    <div class="chat-status">
      <div class="status-dot"></div>
      Dalam Talian
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chatMessages"></div>

  <!-- Input -->
  <div class="chat-input-area">
    <div class="chat-input-row">
      <textarea id="userInput" rows="1" placeholder="Taip soalan anda di sini…" aria-label="Kotak input mesej"></textarea>
      <button id="sendBtn" aria-label="Hantar mesej">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <p class="input-hint">Tanya tentang tatabahasa, ejaan, kosa kata, peribahasa, pembinaan ayat atau karangan.</p>
  </div>

</div>

<!-- Engine -->
<script src="engine.js"></script>

<script>
(function () {
  'use strict';

  const engine  = window.BahasaBudiEngine;
  let session   = engine.createSession();

  const messagesEl = document.getElementById('chatMessages');
  const inputEl    = document.getElementById('userInput');
  const sendBtn    = document.getElementById('sendBtn');

  // ── Markdown-lite renderer ────────────────────────────────────────────────
  function renderMarkdown(text) {
    let html = escapeHtml(text);

    // headings
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');

    // bold / italic
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    html = html.replace(/_(.+?)_/g, '<em>$1</em>');

    // inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    // blockquote
    html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

    // horizontal rule
    html = html.replace(/^---$/gm, '<hr>');

    // links  [text](url)
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

    // tables
    html = html.replace(/^(\|.+\|)\n\|[-|: ]+\|\n((?:\|.+\|\n?)+)/gm, function (_, header, rows) {
      const th = header.split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
      const tr = rows.trim().split('\n').map(row => {
        const cells = row.split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
        return `<tr>${cells}</tr>`;
      }).join('');
      return `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
    });

    // unordered list
    html = html.replace(/^[•\-\*] (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>)/s, (m) => `<ul>${m}</ul>`);
    // wrap consecutive li in ul (multi-pass)
    html = html.replace(/(<li>[^<]*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);

    // numbered list
    html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

    // line breaks → paragraph
    html = html.split('\n\n').map(para => {
      para = para.trim();
      if (!para) return '';
      if (/^<(h[1-6]|ul|ol|table|hr|blockquote)/.test(para)) return para;
      return `<p>${para.replace(/\n/g, '<br>')}</p>`;
    }).join('\n');

    return html;
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Render a message bubble ───────────────────────────────────────────────
  function appendMessage(text, role) {
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    if (role === 'bot') {
      const icon = document.createElement('div');
      icon.className = 'msg-icon';
      icon.textContent = '📚';
      row.appendChild(icon);
    }

    const wrapper = document.createElement('div');
    const bubble  = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = role === 'bot' ? renderMarkdown(text) : escapeHtml(text);

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    wrapper.appendChild(bubble);
    wrapper.appendChild(time);
    row.appendChild(wrapper);
    messagesEl.appendChild(row);
    scrollToBottom();
    return bubble;
  }

  // ── Quick-reply chips ────────────────────────────────────────────────────
  const QUICK_REPLIES = [
    { label: '📖 Tatabahasa',              msg: 'Terangkan tatabahasa Bahasa Melayu' },
    { label: '✏️ Ejaan (di / di-)',         msg: 'Terangkan perbezaan di kata sendi dan di- imbuhan' },
    { label: '💬 Kosa Kata',               msg: 'Bantu saya dengan kosa kata' },
    { label: '📝 Bina Ayat',               msg: 'Bagaimana cara membina ayat yang betul langkah demi langkah' },
    { label: '🌿 Peribahasa',              msg: 'Terangkan peribahasa dan simpulan bahasa' },
    { label: '📄 Karangan',                msg: 'Bantu saya menulis karangan' },
    { label: '🔧 Imbuhan',                 msg: 'Terangkan imbuhan awalan dan akhiran' },
    { label: '🧪 Latihan & Soalan',        msg: 'Berikan saya latihan Bahasa Melayu' },
  ];

  function showQuickReplies() {
    const chipsRow = document.createElement('div');
    chipsRow.className = 'chips-row';
    QUICK_REPLIES.forEach(({ label, msg }) => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = label;
      chip.addEventListener('click', () => {
        chipsRow.remove();
        handleSend(msg);
      });
      chipsRow.appendChild(chip);
    });
    messagesEl.appendChild(chipsRow);
    scrollToBottom();
  }

  // ── Typing indicator ─────────────────────────────────────────────────────
  function showTyping() {
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typingIndicator';

    const icon = document.createElement('div');
    icon.className = 'msg-icon';
    icon.textContent = '📚';

    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    row.appendChild(icon);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── Send flow ─────────────────────────────────────────────────────────────
  function handleSend(overrideText) {
    const text = (overrideText !== undefined ? overrideText : inputEl.value).trim();
    if (!text) return;

    // Remove any lingering chips
    const chips = messagesEl.querySelector('.chips-row');
    if (chips) chips.remove();

    appendMessage(text, 'user');
    inputEl.value = '';
    autoResizeInput();

    showTyping();
    // Simulate a short think delay for naturalness
    const delay = 400 + Math.min(text.length * 6, 900);
    setTimeout(() => {
      hideTyping();
      const result = engine.processMessage(text, session);
      session = result.session || result.sesi;
      appendMessage(result.text, 'bot');
    }, delay);
  }

  // ── Event listeners ───────────────────────────────────────────────────────
  sendBtn.addEventListener('click', () => handleSend());

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  function autoResizeInput() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }
  inputEl.addEventListener('input', autoResizeInput);

  // ── Initial greeting ─────────────────────────────────────────────────────
  (function init() {
    const result = engine.processMessage('hello', session);
    session = result.session || result.sesi;
    appendMessage(result.text, 'bot');
    showQuickReplies();
  })();

})();
</script>

</body>
</html>
